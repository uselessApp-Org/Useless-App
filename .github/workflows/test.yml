name: Test Suite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore UselessApp.sln

      - name: Build solution
        run: dotnet build UselessApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UselessApp.sln --configuration Release --no-build --verbosity normal